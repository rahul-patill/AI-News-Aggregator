databases:
  - name: ai-news-db
    databaseName: ai_news_db
    user: ai_news_user
    plan: free

services:
  - type: cron
    name: ai-news-daily-job
    env: docker
    schedule: "0 8 * * *" # Runs every day at 8:00 AM UTC
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "gemini/gemini-2.5-flash"
      - key: MY_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false

  - type: web
    name: ai-news-api
    env: docker
    dockerCommand: "uv run uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-db
          property: connectionString
